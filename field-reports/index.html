<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QAQC Field Reports</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#003f53">
<link rel="icon" href="/icons/icon-192.png">
<style>
  :root {
    --navy: #003f53; --teal: #00556f; --gold: #c3932c; --gold-light: #f3e8cc;
    --bg: #f2f4f6; --card: #ffffff; --border: #d5dade; --text: #1f2733; --muted: #66707a;
    --danger: #b3261e; --danger-bg: #fdecea; --ok: #13704f; --ok-bg: #e7f4ee; --warn-bg: #fff6e0;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.4 "Segoe UI", Roboto, Arial, sans-serif; }
  button, input, select, textarea { font: inherit; color: inherit; }
  header.top { background: var(--navy); color: #fff; padding: 10px 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; position: sticky; top: 0; z-index: 20; }
  header.top h1 { font-size: 17px; margin: 0; letter-spacing: .02em; }
  header.top .mode { font-size: 12px; background: rgba(255,255,255,.15); padding: 2px 8px; border-radius: 10px; }
  header.top .spacer { flex: 1; }
  header.top .user { font-size: 13px; opacity: .9; cursor: pointer; text-decoration: underline dotted; }
  main { max-width: 1180px; margin: 0 auto; padding: 14px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 12px; }
  .card > summary, .card > .head { padding: 12px 14px; font-weight: 700; color: var(--teal); text-transform: uppercase; font-size: 13px; letter-spacing: .05em; cursor: pointer; list-style: none; display: flex; align-items: center; gap: 8px; border-bottom: 2px solid var(--gold); }
  .card > summary::-webkit-details-marker { display: none; }
  .card > summary::before { content: "\25B8"; color: var(--gold); transition: transform .15s; }
  .card[open] > summary::before { transform: rotate(90deg); }
  .card .body { padding: 12px 14px 14px; }
  .lock { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: none; letter-spacing: 0; margin-left: auto; }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 10px 14px; }
  label.f { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 3px; }
  label.f .req { color: var(--danger); }
  input[type=text], input[type=date], input[type=number], select, textarea {
    width: 100%; padding: 7px 9px; border: 1px solid var(--border); border-radius: 7px; background: #fff; }
  textarea { resize: vertical; min-height: 40px; }
  input:disabled, select:disabled, textarea:disabled { background: #f6f7f8; color: #333; border-color: #e3e6e9; }
  .btn { border: 0; border-radius: 8px; padding: 8px 14px; cursor: pointer; background: #e6e9ed; font-weight: 600; white-space: nowrap; }
  .btn:hover { filter: brightness(.96); }
  .btn.primary { background: var(--teal); color: #fff; }
  .btn.gold { background: var(--gold); color: #1a1a1a; }
  .btn.danger { background: #fff; color: var(--danger); border: 1px solid var(--danger); }
  .btn.small { padding: 4px 9px; font-size: 13px; }
  .btn:disabled { opacity: .45; cursor: default; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  table.grid { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.grid th { background: #f4f4f4; text-align: left; font-size: 12px; color: #444; padding: 6px; border: 1px solid #e1e4e7; }
  table.grid td { border: 1px solid #e1e4e7; padding: 4px; vertical-align: top; }
  table.grid td.ro { padding: 7px 8px; }
  table.grid td.act { width: 1%; white-space: nowrap; }
  table.grid select { min-width: 110px; }
  table.grid tr.note td { background: var(--warn-bg); font-size: 12px; color: #6b5200; border-top: 0; }
  .scroll { overflow-x: auto; }
  .badge { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 9px; border-radius: 10px; background: #e6e9ed; color: #333; }
  .badge.pre { background: #e8eef9; color: #234a8a; }
  .badge.field { background: var(--gold-light); color: #6b4d00; }
  .badge.closeout { background: #e3f0f4; color: var(--teal); }
  .badge.issued { background: var(--ok-bg); color: var(--ok); }
  .stepper { display: flex; gap: 4px; flex-wrap: wrap; }
  .stepper span { font-size: 12px; padding: 4px 10px; border-radius: 12px; background: #e6e9ed; color: var(--muted); }
  .stepper span.done { background: #d9e6ea; color: var(--teal); }
  .stepper span.now { background: var(--gold); color: #1a1a1a; font-weight: 700; }
  .bar { position: sticky; top: 46px; z-index: 15; background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; margin-bottom: 12px; display: flex; gap: 10px 14px; flex-wrap: wrap; align-items: center; box-shadow: 0 2px 6px rgba(0,0,0,.05); }
  .bar .id { font-weight: 700; color: var(--navy); }
  .bar .title { color: var(--muted); font-size: 13px; max-width: 420px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar .status { font-size: 12px; color: var(--muted); }
  .bar .status.dirty { color: var(--danger); font-weight: 600; }
  .banner { border-radius: 8px; padding: 9px 12px; font-size: 14px; margin-bottom: 12px; }
  .banner.info { background: #e3f0f4; color: var(--navy); }
  .banner.warn { background: var(--warn-bg); color: #6b5200; }
  .photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
  .ph { border: 1px solid var(--border); border-radius: 8px; padding: 8px; background: #fafbfc; display: flex; flex-direction: column; gap: 6px; }
  .ph img { width: 100%; height: 170px; object-fit: contain; background: #e9ecef; border-radius: 6px; }
  .ph .n { font-size: 12px; font-weight: 700; color: var(--teal); }
  .ph .fieldcap { font-size: 12px; color: #6b5200; background: var(--warn-bg); padding: 3px 6px; border-radius: 5px; }
  .drawing img { max-width: 100%; max-height: 360px; display: block; margin: 0 auto 6px; border: 1px solid var(--border); }
  .block { border: 1px dashed var(--border); border-radius: 8px; padding: 10px; margin: 8px 0; }
  .block .kind { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; margin-bottom: 6px; }
  .hint { font-size: 12px; color: var(--muted); }
  .list td, .list th { padding: 8px; }
  .list tr.clickable { cursor: pointer; }
  .list tr.clickable:hover td { background: #f7f9fa; }
  .home-actions { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; align-items: center; }
  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 16px; }
  .modal { background: #fff; border-radius: 12px; max-width: 520px; width: 100%; padding: 18px; box-shadow: 0 10px 30px rgba(0,0,0,.25); max-height: 90vh; overflow: auto; }
  .modal h3 { margin: 0 0 10px; color: var(--navy); font-size: 17px; }
  .modal .buttons { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; flex-wrap: wrap; }
  .modal .field { margin-bottom: 10px; }
  .modal .buttons.stack { flex-direction: column; align-items: stretch; }
  .modal .buttons.stack .btn { padding: 12px 14px; text-align: left; }
  .toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--navy); color: #fff; padding: 10px 18px; border-radius: 8px; z-index: 60; font-size: 14px; }
  .empty { color: var(--muted); font-size: 14px; padding: 6px 0; }
  .params td:first-child { width: 34%; }
  @media (max-width: 700px) { .bar { top: 0; position: static; } }
</style>
</head>
<body>
<header class="top">
  <h1>QAQC Field Reports</h1>
  <span class="mode" id="modeLabel"></span>
  <span class="mode" title="App version">v2026-10-28a</span>
  <span class="spacer"></span>
  <span class="user" id="userLabel" data-act="set-user" title="Change your name"></span>
</header>
<main id="app"></main>
<input type="file" id="picker" style="display:none">

<script>
// ============================================================================
//  Inspection Report Generator - field_report.js
//
//  JavaScript port of field_report.py: builds the Field Report .docx from a
//  report package (report.json + images) with the "docx" library, so the
//  report can be issued from the browser (PC, tablet, phone) with nothing
//  installed. Layout must stay identical to the Python version; parity is
//  checked by rendering both through Word and comparing the PDFs.
//
//  Usage (browser: <script src=".../docx@9.5.1/dist/index.iife.js">, then
//  this file; Node: require):
//    const doc = await FieldReportDocx.build(report, {
//      docx,                      // the docx library object
//      getImage: async (path, maxWpx, maxHpx) => ({ data, width, height, type }),
//      logo: { data, width, height },   // PNG bytes of the GMIN logo
//      draft: true|false
//    });
//    const blob = await docx.Packer.toBlob(doc);
// ============================================================================
(function (root) {
  'use strict';

  const SITE_NAME = 'Oko Gold Mines';
  const COUNTRY = 'Guyana';
  const BLOCK_LABEL = 'OKO GOLD MINES\nQA/QC';

  // GMIN Brand Kit (same values as field_report.py)
  const TEAL = '00556F';
  const GOLD = 'C3932C';
  const GOLD_LIGHT = 'E6D3A3';
  const LABEL_FILL = 'F4F4F4';
  const TOTAL_FILL = 'F9F9F9';
  const HIGHLIGHT_FILL = 'DDE3EA';
  const BORDER = 'D9D9D9';
  const TEXT = '222222';
  const GRAY = '6B6B6B';
  const TONE_COLORS = { pass: '13704F', fail: 'B3261E', neutral: '595959' };
  const STATUS_TONES = { ACCEPTED: 'pass', CLOSED: 'pass', OPEN: 'fail', REJECTED: 'fail' };

  const HEADING_FONT = 'Montserrat';
  const BODY_FONT = 'Segoe UI';

  const PAGE_W_IN = 8.5;
  const MARGIN_LR_IN = 0.65;
  const CONTENT_W_IN = PAGE_W_IN - 2 * MARGIN_LR_IN; // 7.2in
  const PHOTO_COL_W_IN = CONTENT_W_IN / 2;
  const PHOTO_BOX_W_IN = 3.45;
  const PHOTO_BOX_H_IN = 4.4;
  const DRAWING_BOX_W_IN = 6.9;
  const DRAWING_BOX_H_IN = 7.0;
  const IMAGE_TARGET_DPI = 200;

  const tw = (inches) => Math.round(inches * 1440); // twips
  const px = (inches) => inches * 96;                // docx ImageRun unit

  // ---------------------------------------------------------------------------
  //  Text helpers
  // ---------------------------------------------------------------------------
  // em dash (0x2014) and en dash (0x2013), built from their codes so the
  // characters themselves never appear in this file
  const DASHES = String.fromCharCode(0x2014, 0x2013);
  const DASH_PUNCT = new RegExp('\\s+[' + DASHES + ']\\s+', 'g');
  const DASH_ANY = new RegExp('[' + DASHES + ']', 'g');
  function clean(text) {
    // No em/en dashes in any issued report (QAQC house rule)
    if (text === null || text === undefined) return '';
    return String(text).replace(DASH_PUNCT, ', ').replace(DASH_ANY, '-').trim();
  }
  function fmtDate(iso) {
    if (!iso) return '';
    const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(iso));
    return m ? `${m[3]}/${m[2]}/${m[1]}` : clean(iso);
  }
  function fmtNumber(v) {
    return (typeof v === 'number' && Number.isInteger(v)) ? String(v) : String(v);
  }
  const upper = (s) => clean(s).toUpperCase();

  // ---------------------------------------------------------------------------
  //  Builder bound to one docx library instance
  // ---------------------------------------------------------------------------
  function makeBuilder(D) {
    const {
      Paragraph, TextRun, Table, TableRow, TableCell, ImageRun, Header, Footer, Tab,
      PageBreak, PageNumber, AlignmentType, BorderStyle, ShadingType, VerticalAlign,
      WidthType, TableLayoutType, TabStopType, LineRuleType
    } = D;
    const ALIGN = { left: AlignmentType.LEFT, center: AlignmentType.CENTER, right: AlignmentType.RIGHT, justify: AlignmentType.JUSTIFIED };

    function run(text, { font = BODY_FONT, size = 9.5, bold, color, italics, spacing, breakBefore } = {}) {
      const o = { text, font, size: Math.round(size * 2) };
      if (bold) o.bold = true;
      if (italics) o.italics = true;
      if (color) o.color = color;
      if (spacing) o.characterSpacing = spacing;
      if (breakBefore) o.break = 1;
      return new TextRun(o);
    }
    const border = (color, size, space) => ({ style: BorderStyle.SINGLE, color, size, space });
    const NONE = { style: BorderStyle.NONE, size: 0, color: 'auto' };
    const allBorders = (b) => ({ top: b, bottom: b, left: b, right: b, insideHorizontal: b, insideVertical: b });

    // A cell description; materialized by table() so keep-together can be applied
    function cellText(text, { bold = false, color = TEXT, size = 8.5, align = 'left', font = BODY_FONT, fill, valign = 'center' } = {}) {
      const lines = (text === null || text === undefined || text === '') ? [''] : clean(text).split('\n');
      return {
        kind: 'text', fill, valign,
        para: (keepNext) => new Paragraph({
          alignment: ALIGN[align], keepNext, spacing: { before: 0, after: 0 },
          children: lines.map((line, i) => run(line, { font, size, bold, color, breakBefore: i > 0 }))
        })
      };
    }

    function table({ widths, rows, margins = { top: 70, bottom: 70, left: 110, right: 110 }, borders = true, keepTogether = false, headerRows = 0 }) {
      const n = rows.length;
      const chained = keepTogether ? (n <= 15 ? n - 1 : 1) : 0;
      return new Table({
        columnWidths: widths.map(tw),
        width: { size: widths.reduce((a, b) => a + tw(b), 0), type: WidthType.DXA },
        layout: TableLayoutType.FIXED,
        alignment: AlignmentType.CENTER,
        margins,
        borders: borders ? allBorders(border(BORDER, 4)) : allBorders(NONE),
        rows: rows.map((cells, r) => new TableRow({
          cantSplit: true,
          tableHeader: r < headerRows,
          children: cells.map((c, i) => {
            const keepNext = r < chained;
            const opts = { width: { size: tw(widths[i]), type: WidthType.DXA } };
            if (c.fill) opts.shading = { fill: c.fill, type: ShadingType.CLEAR, color: 'auto' };
            if (c.valign) opts.verticalAlign = c.valign === 'top' ? VerticalAlign.TOP : VerticalAlign.CENTER;
            if (c.borders) opts.borders = c.borders;
            opts.children = c.kind === 'text' ? [c.para(keepNext)] : c.children(keepNext);
            return new TableCell(opts);
          })
        }))
      });
    }

    function spacer(pts) {
      return new Paragraph({ spacing: { before: 0, after: 0, line: pts * 20, lineRule: LineRuleType.EXACT }, children: [] });
    }

    function sectionHeading(number, text) {
      return new Paragraph({
        keepNext: true, spacing: { before: 280, after: 160 },
        border: { bottom: border(GOLD, 8, 4) },
        children: [run(number ? `${number}. ${upper(text)}` : upper(text), { font: HEADING_FONT, size: 9.5, bold: true, color: TEAL, spacing: 10 })]
      });
    }

    function captionParagraph(text) {
      return new Paragraph({ alignment: AlignmentType.LEFT, spacing: { before: 80, after: 160 }, children: [run(clean(text), { size: 8, color: GRAY })] });
    }

    // fit an image into a box (inches), like fit_image() in Python
    async function imageRun(getImage, path, maxW, maxH) {
      const probe = await getImage(path, null, null);
      const ratio = probe.width / probe.height;
      let w = maxW, h = maxW / ratio;
      if (h > maxH) { h = maxH; w = maxH * ratio; }
      const img = await getImage(path, Math.max(1, Math.round(w * IMAGE_TARGET_DPI)), Math.max(1, Math.round(h * IMAGE_TARGET_DPI)));
      return new ImageRun({ type: img.type || 'jpg', data: img.data, transformation: { width: px(w), height: px(h) } });
    }

    // ---- sections ------------------------------------------------------------
    function titleBlock(data) {
      const h = data.header || {};
      const seq = data.seq;
      const noText = (seq !== null && seq !== undefined) ? `No.${String(parseInt(seq, 10)).padStart(4, '0')}` : clean(data.reportId);
      const tealBorders = { top: border(TEAL, 4), bottom: border(TEAL, 4), left: border(TEAL, 4), right: border(TEAL, 4) };
      const r0 = [
        Object.assign(cellText(BLOCK_LABEL, { bold: true, color: 'FFFFFF', size: 9.5, font: HEADING_FONT, fill: TEAL, valign: 'top' }),
          { borders: Object.assign({}, tealBorders, { right: border('FFFFFF', 8) }) }),
        Object.assign(cellText(upper(h.title), { bold: true, color: 'FFFFFF', size: 9.5, font: HEADING_FONT, fill: TEAL, valign: 'top' }), { borders: tealBorders }),
        Object.assign(cellText(noText, { bold: true, color: 'FFFFFF', size: 15, font: HEADING_FONT, fill: TEAL, align: 'right', valign: 'top' }), { borders: tealBorders })
      ];
      const wbs = clean(h.wbs);
      const r1 = [
        cellText(wbs ? `WBS ${wbs}` : '', { bold: true, size: 9, fill: LABEL_FILL, valign: 'top' }),
        cellText(h.location, { size: 9, valign: 'top' }),
        cellText('DATE OF INSPECTION:\n' + fmtDate(h.inspectionDate), { size: 8.5, valign: 'top' })
      ];
      return table({ widths: [1.95, 3.85, 1.4], rows: [r0, r1], margins: { top: 110, bottom: 110, left: 140, right: 140 } });
    }

    function kvGrid(pairs) {
      const rows = [];
      for (let i = 0; i < pairs.length; i += 2) {
        const row = [];
        for (const pair of pairs.slice(i, i + 2)) {
          row.push(cellText(pair[0] + ':', { bold: true, size: 8.5, fill: LABEL_FILL, valign: 'top' }));
          row.push(cellText(pair[1], { size: 8.5, valign: 'top' }));
        }
        if (row.length === 2) {
          row.push(cellText('', { fill: LABEL_FILL }));
          row.push({ kind: 'raw', children: () => [new Paragraph({ children: [] })] });
        }
        rows.push(row);
      }
      return table({ widths: [1.5, 2.1, 1.5, 2.1], rows, margins: { top: 100, bottom: 100, left: 130, right: 130 }, keepTogether: true });
    }

    function gridTable(headers, body, widths, fmt, total) {
      const rows = [headers.map(hd => cellText(hd, { bold: true, size: 8.5, fill: LABEL_FILL }))];
      body.forEach(values => rows.push(values.map((v, i) => cellText(v, Object.assign({ size: 8.5 }, fmt ? fmt(i, v) : {})))));
      if (total) rows.push(total.map((v, i) => cellText(v, Object.assign({ size: 8.5, bold: true, fill: TOTAL_FILL }, (fmt && i > 0) ? fmt(i, v) : {}))));
      return table({ widths, rows, keepTogether: true, headerRows: 1 });
    }

    function columnWidths(columns) {
      const weights = columns.map(c => c.type === 'number' ? 0.8 : c.type === 'result' ? 1.0 : 1.35);
      const s = weights.reduce((a, b) => a + b, 0);
      return weights.map(w => CONTENT_W_IN * w / s);
    }

    function resultTone(col, value) {
      for (const opt of col.options || []) if (String(opt.value || '').toUpperCase() === String(value).toUpperCase()) return opt.tone || 'neutral';
      return 'neutral';
    }

    function resultsTable(block) {
      const columns = block.columns || [], rows = block.rows || [];
      const filled = (v) => v !== null && v !== undefined && v !== '';
      const body = rows.map(r => columns.map(c => filled(r[c.key]) ? fmtNumber(r[c.key]) : ''));
      let total = null;
      if (block.totalRow && rows.length) {
        total = columns.map((col, i) => {
          if (i === 0) return 'Total';
          if (col.total === 'sum') {
            const s = rows.reduce((a, r) => a + (parseFloat(r[col.key]) || 0), 0);
            let txt = fmtNumber(s);
            if (col.percentOf) {
              const base = rows.reduce((a, r) => a + (parseFloat(r[col.percentOf]) || 0), 0);
              if (base) txt += ` (${Math.round(100 * s / base)}%)`;
            }
            return txt;
          }
          if (col.total === 'worst' && col.type === 'result') {
            const vals = rows.filter(r => r[col.key]).map(r => String(r[col.key]));
            const fails = vals.filter(v => resultTone(col, v) === 'fail');
            const passes = vals.filter(v => resultTone(col, v) === 'pass');
            return fails.length ? fails[0] : (passes.length && passes.length === vals.length ? passes[0] : '');
          }
          return '';
        });
      }
      const fmt = (i, v) => (columns[i].type === 'result' && v)
        ? { bold: true, color: TONE_COLORS[resultTone(columns[i], v)], align: 'center' } : {};
      return gridTable(columns.map(c => c.label || ''), body, columnWidths(columns), fmt, total);
    }

    function findingsTable(findings) {
      if (!findings.length) findings = [{ id: 1, location: '', finding: 'No findings recorded during this inspection.', recommendation: 'N/A', status: '' }];
      const rows = findings.map((f, i) => [String(i + 1), f.location, f.finding, f.recommendation, (f.status || '').toUpperCase()]);
      const fmt = (i, v) => (i === 4 && v) ? { bold: true, color: TONE_COLORS[STATUS_TONES[v] || 'neutral'], align: 'center' } : {};
      return gridTable(['No.', 'Location / Ref.', 'Finding', 'Recommendation', 'Status'], rows, [0.5, 1.65, 2.45, 1.55, 1.05], fmt);
    }

    async function drawingBlocks(getImage, items) {
      const out = [];
      for (const d of items) {
        const img = await imageRun(getImage, d.file, DRAWING_BOX_W_IN, DRAWING_BOX_H_IN);
        out.push(table({ widths: [CONTENT_W_IN], rows: [[{ kind: 'raw', children: () => [new Paragraph({ alignment: AlignmentType.CENTER, children: [img] })] }]] }));
        out.push(d.caption ? captionParagraph(d.caption) : spacer(6));
      }
      return out;
    }

    async function photoGrid(getImage, photos) {
      const rows = [];
      for (let i = 0; i < photos.length; i += 2) {
        const row = [];
        for (let k = i; k < Math.min(i + 2, photos.length); k++) {
          const ph = photos[k];
          const img = await imageRun(getImage, ph.file, PHOTO_BOX_W_IN, PHOTO_BOX_H_IN);
          const cap = clean(ph.caption);
          row.push({ kind: 'raw', valign: 'top', children: () => [
            new Paragraph({ spacing: { after: 0 }, children: [img] }),
            captionParagraph(cap ? `Photo ${k + 1}: ${cap}` : `Photo ${k + 1}`)
          ] });
        }
        if (row.length === 1) row.push({ kind: 'raw', children: () => [new Paragraph({ children: [] })] });
        rows.push(row);
      }
      return table({ widths: [PHOTO_COL_W_IN, PHOTO_COL_W_IN], rows, borders: false, margins: { top: 0, bottom: 60, left: 0, right: 110 } });
    }

    function bodyText(text) {
      return clean(text).split('\n').filter(p => p.trim())

    p += 46 + nlen + xlen + clen;
    if (want && !want(name)) continue;
    const lh = new DataView((await bytes(off, off + 30)).buffer);
    const start = off + 30 + lh.getUint16(26, true) + lh.getUint16(28, true);
    let data = await bytes(start, start + csize);
    if (method === 8) data = new Uint8Array(await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());
    else if (method !== 0) throw new Error('The package uses an unsupported compression.');
    out[name] = data;
  }
  return out;
}

function download(blob, name) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 60000);
}

// ---------------------------------------------------------------------------
//  Local draft (IndexedDB): survives a tab reload or Chrome closing the tab
// ---------------------------------------------------------------------------
let dbPromise = null;
function db() {
  if (!dbPromise) dbPromise = new Promise((res, rej) => {
    const r = indexedDB.open('fieldReports', 2);
    r.onupgradeneeded = () => {
      for (const name of ['drafts', 'settings']) if (!r.result.objectStoreNames.contains(name)) r.result.createObjectStore(name, { keyPath: 'key' });
    };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
  return dbPromise;
}
async function idb(mode, fn, store = 'drafts') {
  try {
    const d = await db();
    return await new Promise((res, rej) => {
      const tx = d.transaction(store, mode); const req = fn(tx.objectStore(store));
      tx.oncomplete = () => res(req && req.result); tx.onerror = () => rej(tx.error);
    });
  } catch (e) { return null; } // storage blocked: the app still works, just without drafts
}
const getSetting = async (key) => { const v = await idb('readonly', st => st.get(key), 'settings'); return v ? v.value : null; };
const setSetting = (key, value) => idb('readwrite', st => (value == null ? st.delete(key) : st.put({ key, value })), 'settings');
const draftKey = () => `${S.mode}:${S.report.reportId}`;
// same number is not enough: a deleted test report and a new one can share
// it, so the creation time must match too
const created = (r) => (r && r.phaseHistory && r.phaseHistory[0] && r.phaseHistory[0].at) || '';
const sameReport = (d, r) => !!d && created(d.report) === created(r);
let draftTimer = null;
function scheduleDraft() { clearTimeout(draftTimer); draftTimer = setTimeout(saveDraft, 700); }
async function saveDraft() {
  if (!S.report || S.readOnly) return;
  const assets = {}; for (const [p, a] of Object.entries(S.assets)) if (a.blob) assets[p] = a.blob;
  await idb('readwrite', st => st.put({
    key: draftKey(), mode: S.mode, reportId: S.report.reportId, title: S.report.header.title,
    report: S.report, file: S.file, origName: S.origName, baseRevision: S.baseRevision,
    removed: [...S.removed], assets, savedAt: nowIso(), dirty: S.dirty
  }));
}
const getDraft = (key) => idb('readonly', st => st.get(key));
const dropDraft = (key) => idb('readwrite', st => st.delete(key || draftKey()));
const allDrafts = () => idb('readonly', st => st.getAll());

function markDirty() {
  S.dirty = true; scheduleDraft();
  const st = document.getElementById('saveStatus'); if (st) { st.textContent = 'Unsaved changes'; st.className = 'status dirty'; }
}

function ownsPhase(ph) { return office() ? (ph === 'pre' || ph === 'field' || ph === 'closeout') : ph === 'field'; }
function can(part) {
  if (!S.report || S.readOnly) return false;
  const ph = S.report.phase;
  return ownsPhase(ph) && RULES[part].includes(ph);
}

function stepper(ph) {
  const i = PHASES.indexOf(ph);
  return `<div class="stepper">${PHASES.map((p, k) => `<span class="${k < i ? 'done' : k === i ? 'now' : ''}">${k + 1}. ${PHASE_LABEL[p]}</span>`).join('')}</div>`;
}

function phaseBanner() {
  const ph = S.report.phase;
  if (S.readOnly || ph === 'issued') return `<div class="banner info">This report is issued. Read only.</div>`;
  if (ownsPhase(ph)) {
    const msg = { pre: 'Pre-report: register the reference documents, the parameters to verify and the area. Then move it to Field.',
      field: 'Field: take the photos, write preliminary captions and findings, fill in the results. Save, then move it to Close-out.',
      closeout: 'Close-out: review captions and findings, write the conclusion, preview the draft and issue the report.' }[ph];
    const both = ph === 'field' && office() ? ' The tablet can also work on this phase: use one device per report, otherwise the newest save replaces the other (kept in _superseded).' : '';
    return `<div class="banner info">${msg}${both}</div>`;
  }
  const where = ph === 'field' ? 'on the tablet' : 'in the office (PC)';
  return `<div class="banner warn">This report is in the ${PHASE_LABEL[ph]} phase, which is edited ${where}. It is read only here.</div>`;
}

function actionButtons() {
  const ph = S.report.phase; const out = [];
  // Word built in the browser (field_report.js): any phase, any device
  const word = S.mode !== 'server' ? `<button class="btn" data-act="word-draft">Word draft (.docx)</button>` : '';
  if (S.readOnly || ph === 'issued') return word;
  if (word) out.push(word);
  if (ownsPhase(ph)) out.push(`<button class="btn primary" data-act="save">Save</button>`);
  if (S.mode === 'server') out.push(`<button class="btn" data-act="draft">Draft preview (Word)</button>`);
  const prev = PHASES[PHASES.indexOf(ph) - 1];
  const canBack = prev && (ownsPhase(ph) || (office() && ph === 'field'));
  if (canBack) out.push(`<button class="btn" data-act="back">Return to ${PHASE_LABEL[prev]}</button>`);
  if (ph === 'pre' && office()) out.push(`<button class="btn gold" data-act="next">Move to next phase (Field)</button>`);
  if (ph === 'field') out.push(`<button class="btn gold" data-act="next">Move to next phase (Close-out)</button>`);
  if (ph === 'closeout' && office()) out.push(`<button class="btn gold" data-act="issue">Issue report</button>`);
  return out.join('');
}

function inp(path, { type, disabled, placeholder, num, rows } = {}) {
  const v = getPath(S.report, path);
  const dis = disabled ? 'disabled' : '';
  if (type === 'textarea') return `<textarea data-path="${path}" rows="${rows || 2}" ${dis} placeholder="${esc(placeholder || '')}">${esc(v)}</textarea>`;
  return `<input type="${type || 'text'}" data-path="${path}" ${num ? 'data-num="1" inputmode="decimal"' : ''} value="${esc(v)}" ${dis} placeholder="${esc(placeholder || '')}">`;
}
function sel(path, options, disabled) {
  const v = getPath(S.report, path) || '';
  return `<select data-path="${path}" ${disabled ? 'disabled' : ''}>${options.map(o => `<option ${o === v ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>`;
}
function fld(label, path, opts = {}) {
  return `<div><label class="f">${esc(label)}${opts.req ? ' <span class="req">*</span>' : ''}</label>${inp(path, opts)}</div>`;
}
function card(title, body, { open = true, locked = false } = {}) {

}

function moveBtns(path, i, n) {
  return `<button class="btn small" data-act="move" data-path="${path}" data-i="${i}" data-d="-1" ${i === 0 ? 'disabled' : ''}>Up</button>
    <button class="btn small" data-act="move" data-path="${path}" data-i="${i}" data-d="1" ${i === n - 1 ? 'disabled' : ''}>Down</button>`;
}

function tableEditor(path, cols, editable, addLabel, noteFor) {
  const rows = getPath(S.report, path) || [];
  const head = `<tr>${cols.map(c => `<th>${esc(c.label)}</th>`).join('')}${editable ? '<th></th>' : ''}</tr>`;
  const body = rows.map((row, i) => {
    const cells = cols.map(c => {
      const p = `${path}.${i}.${c.key}`;
      if (!editable) return `<td class="ro">${esc(row[c.key])}</td>`;
      if (c.type === 'select') return `<td>${sel(p, c.options)}</td>`;
      if (c.type === 'textarea') return `<td>${inp(p, { type: 'textarea' })}</td>`;
      return `<td>${inp(p, { num: c.type === 'number', type: 'text' })}</td>`;
    }).join('');
    const note = noteFor ? noteFor(row) : '';
    return `<tr>${cells}${editable ? `<td class="act"><button class="btn small danger" data-act="row-del" data-path="${path}" data-i="${i}">Remove</button></td>` : ''}</tr>
      ${note ? `<tr class="note"><td colspan="${cols.length + (editable ? 1 : 0)}">${esc(note)}</td></tr>` : ''}`;
  }).join('');
  return `<div class="scroll">${rows.length ? `<table class="grid">${head}${body}</table>` : '<div class="empty">Nothing here yet.</div>'}</div>
    ${editable ? `<div class="row" style="margin-top:8px"><button class="btn small" data-act="row-add" data-path="${path}" data-keys="${cols.map(c => c.key).join(',')}">${esc(addLabel)}</button></div>` : ''}`;
}

          ${b.rows.map((row, ri) => `<tr>${row.map((v, ci) => `<td>${edit ? inp(`${base}.rows.${ri}.${ci}`) : esc(v)}</td>`).join('')}
            ${edit ? `<td class="act"><input type="checkbox" data-act="annex-hl" data-path="${base}" data-i="${ri}" ${hl.has(ri) ? 'checked' : ''}></td>
            <td class="act"><button class="btn small danger" data-act="annex-row-del" data-path="${base}" data-i="${ri}">Remove</button></td>` : ''}</tr>`).join('')}
          </table></div>
          ${edit ? `<div class="row" style="margin-top:6px"><button class="btn small" data-act="annex-row-add" data-path="${base}">+ Row</button>
            <button class="btn small" data-act="annex-col-add" data-path="${base}">+ Column</button>
            <button class="btn small" data-act="annex-col-del" data-path="${base}" ${b.columns.length < 2 ? 'disabled' : ''}>- Last column</button></div>` : ''}`;
      }
      return `<div class="block"><div class="kind">${esc(b.kind)}</div>${inner}
        ${edit ? `<div class="row" style="margin-top:6px"><button class="btn small danger" data-act="block-del" data-path="annexes.${ai}.blocks" data-i="${bi}">Remove ${esc(b.kind)}</button></div>` : ''}</div>`;
    }).join('');
    return `<div class="block" style="border-style:solid">
      <div class="kind">Annex ${ai + 1}</div><label class="f">Annex title</label>${inp(`annexes.${ai}.title`, { disabled: !edit })}
      ${blocks}
      ${edit ? `<div class="row" style="margin-top:8px">
        <button class="btn small" data-act="block-add" data-kind="image" data-ai="${ai}">+ Image (print)</button>
        <button class="btn small" data-act="block-add" data-kind="table" data-ai="${ai}">+ Table</button>
        <button class="btn small" data-act="block-add" data-kind="text" data-ai="${ai}">+ Text</button>
        <button class="btn small danger" data-act="annex-del" data-i="${ai}">Remove annex</button></div>` : ''}</div>`;
  }).join('');
  return `${html || '<div class="empty">No annexes. They are optional.</div>'}
    ${edit ? `<button class="btn small" data-act="annex-add">+ Add annex</button>` : ''}`;
}

// ---------------------------------------------------------------------------
//  Loading reports
// ---------------------------------------------------------------------------
async function loadList() {
  S.list = await api('GET', '/api/reports');
}

function resetReportState() {
  for (const a of Object.values(S.assets)) if ((a.blob || a.src) && a.url) URL.revokeObjectURL(a.url);
  S.assets = {}; S.removed = new Set(); S.dirty = false;
}

// images of the package just loaded or saved (office modes)
function setPackageAssets(res) {
  for (const p of res.assets) {
    const src = res.blobs && res.blobs[p];
    S.assets[p] = src ? { src, url: URL.createObjectURL(src) } : { url: serverAssetUrl(p) };
  }
}

function serverAssetUrl(path) {
  return `/api/asset?file=${encodeURIComponent(S.file)}&path=${encodeURIComponent(path)}&t=${encodeURIComponent(S.token)}${S.issuedPkg ? '&issued=1' : ''}&v=${S.report.revision}`;
}

async function openServerReport(file, issued) {
  const res = await api('GET', `/api/report?file=${encodeURIComponent(file)}${issued ? '&issued=1' : ''}`);
  resetReportState();
  S.report = res.report; S.file = res.file; S.readOnly = !!res.readOnly; S.issuedPkg = !!issued;
  S.baseRevision = res.report.revision;
  setPackageAssets(res);
  if (!issued) {
    const d = await getDraft(draftKey());
    if (d && d.dirty && d.baseRevision === S.baseRevision && sameReport(d, S.report)) {
      const ok = await confirmBox('Unsaved changes found', `This browser kept changes to this report from ${fmtWhen(d.savedAt)} that were never saved. Restore them?`, 'Restore');
      if (ok) {
        S.report = d.report; S.removed = new Set(d.removed || []); S.dirty = true;
        for (const p of S.removed) delete S.assets[p];
        for (const [p, blob] of Object.entries(d.assets || {})) S.assets[p] = { blob, url: URL.createObjectURL(blob) };
      } else await dropDraft();
    } else if (d) await dropDraft();
  }
  S.view = 'report'; render(); window.scrollTo(0, 0);
}

async function openZipFile(file) {
  const files = await readZip(file);
  if (!files['report.json']) throw new Error('report.json is missing: this is not a report package.');
  const report = JSON.parse(new TextDecoder().decode(files['report.json']));
  const key = `file:${report.reportId}`;
  const d = await getDraft(key);
  if (d && !sameReport(d, report)) {
    const r = await modal({ title: 'Old work on this device',
      html: `<p>This device keeps work from ${esc(fmtWhen(d.savedAt))} under the same number, ${esc(report.reportId)}, but it belongs to an older report that no longer exists. It will be discarded.</p>`,
      buttons: [{ label: 'Cancel', value: 'no' }, { label: 'Discard and open', value: 'yes', primary: true }] });
    if (r.button !== 'yes') return;
    await dropDraft(key);
  } else if (d && d.dirty && (d.baseRevision || 0) >= (report.revision || 0)) {
    const r = await modal({ title: 'Work in progress on this device',
      html: `<p>This device has unsaved work on ${esc(report.reportId)} from ${esc(fmtWhen(d.savedAt))}. Continue that work, or start again from the package you just opened?</p>`,
      buttons: [{ label: 'Use the package', value: 'pkg' }, { label: 'Continue my work', value: 'draft', primary: true }] });
    if (r.button === 'draft') return resumeDraft(d);
  }
  resetReportState();
  S.report = report; S.file = null; S.readOnly = false; S.issuedPkg = false;
  S.origName = file.name.replace(/\.zip\.txt$/i, '.zip').replace(/( \(\d+\)| - rev\d+)+(?=\.zip$)/i, '');
  S.baseRevision = report.revision;
  for (const [name, data] of Object.entries(files)) {
    if (name === 'report.json') continue;
    const blob = new Blob([data], { type: 'image/jpeg' });
    S.assets[name] = { blob, url: URL.createObjectURL(blob) };
  }
  S.view = 'report'; await saveDraft(); render(); window.scrollTo(0, 0);
}

function resumeDraft(d) {
  resetReportState();
  S.report = d.report; S.file = d.file; S.origName = d.origName; S.baseRevision = d.baseRevision;
  S.readOnly = false; S.issuedPkg = false; S.dirty = !!d.dirty;
  for (const [p, blob] of Object.entries(d.assets || {})) S.assets[p] = { blob, url: URL.createObjectURL(blob) };
  S.view = 'report'; render(); window.scrollTo(0, 0);
}

async function goHome() {
  if (S.dirty && office() && !await confirmBox('Unsaved changes', 'Leave without saving? The changes stay in this browser and are offered again when you reopen the report.', 'Leave')) return;
  if (office()) { await loadList(); } else { S.fileDrafts = (await allDrafts() || []).filter(d => d.mode === 'file'); }
  S.view = 'home'; S.report = null; render();
}

// ---------------------------------------------------------------------------
//  Saving and phases
// ---------------------------------------------------------------------------
async function save() {
  await askUser();
  if (office()) {
    const newAssets = {};
    for (const [p, a] of Object.entries(S.assets)) if (a.blob) newAssets[p] = S.mode === 'server' ? await blobToB64(a.blob) : a.blob;
    const res = await api('POST', '/api/save', { file: S.file, baseRevision: S.baseRevision, report: S.report, newAssets, removedAssets: [...S.removed], by: user() });
    await dropDraft();
    resetReportState();
    S.report = res.report; S.file = res.file; S.baseRevision = res.report.revision;
    setPackageAssets({ assets: collectRefs(S.report), blobs: res.blobs });
    render(); toast(`Saved (revision ${S.report.revision})`);
  } else {
    S.report.revision = (S.baseRevision || 0) + 1;
    S.report.lastSaved = { at: nowIso(), by: user(), device: 'tablet' };
    const enc = new TextEncoder();
    const entries = [{ name: 'report.json', data: enc.encode(JSON.stringify(S.report, null, 2)) }];
    for (const p of collectRefs(S.report)) {
      const a = S.assets[p]; if (!a || !a.blob) throw new Error(`Image missing from the report: ${p}`);
      entries.push({ name: p, data: new Uint8Array(await a.blob.arrayBuffer()) });
    }
    // The OneDrive app refuses to upload over an existing name, so every save
    // gets its own name ("... - rev5.zip"); the office app keeps the newest.
    const base = (S.origName || `${S.report.reportId}.zip`).replace(/\.zip$/i, '');
    const name = `${base} - rev${S.report.revision}.zip`;
    const zip = makeZip(entries);
    S.baseRevision = S.report.revision; S.dirty = false; await saveDraft(); render();
    if (await sharePackage(zip, name)) return;
    download(zip, name);
    await modal({ title: 'Package saved', html: `<p>The file <b>${esc(name)}</b> was saved to Downloads.</p>
      <p>Now upload it with the OneDrive app to <b>OKO-QAQC &gt; 006 - Field Reports &gt; 01 - In Progress</b>.
      It has a new name, so nothing is overwritten: the office app keeps the newest revision automatically.</p>
      <p class="hint">Your work also stays on this device until you discard it.</p>` });
  }
}

// Straight from the app to SharePoint/OneDrive through the Android share menu.
// Android browsers refuse to share .zip files, so the package travels as
// ".zip.txt" (same bytes); the office app gives it back its .zip name.
// False: use Downloads.
async function sharePackage(blob, name) {
  const file = new File([blob], `${name}${SHARE_SUFFIX}`, { type: 'text/plain' });
  try { if (!navigator.canShare || !navigator.canShare({ files: [file] })) return false; } catch (e) { return false; }
  for (;;) {
    const r = await modal({ title: 'Package ready', html: `<p><b>${esc(name)}${SHARE_SUFFIX}</b></p>
      <p>Tap <b>Send</b>, choose <b>SharePoint</b> (or OneDrive), then <b>OKO-QAQC &gt; Documents &gt; 006 - Field Reports &gt; 01 - In Progress</b>.</p>
      <p class="hint">It has a new name, so nothing is overwritten: the office app keeps the newest revision and turns ".zip.txt" back into ".zip". Your work also stays on this device until you discard it.</p>`,
      buttons: [{ label: 'Save to Downloads instead', value: 'dl' }, { label: 'Send', value: 'send', primary: true }] });
    if (r.button !== 'send') return false;
    try { await navigator.share({ files: [file], title: name }); toast('Sent. Check that it reached 01 - In Progress.', 4000); return true; }
    catch (e) { if (e.name !== 'AbortError') { await alertBox('Could not send', `${e.message || e}. The package goes to Downloads instead.`); return false; } }
  }
}

function collectRefs(r) {
  const out = [];
  r.photos.forEach(p => out.push(p.file)); r.drawings.forEach(d => out.push(d.file));
  r.annexes.forEach(a => a.blocks.forEach(b => { if (b.kind === 'image') out.push(b.file); }));
  return out;
}

function freezeFieldRecord() {
  // Option B: the field text is kept as first written. Items already frozen
  // (an earlier pass through Field) are never overwritten.
  const r = S.report; const rec = r.fieldRecord || { frozenAt: nowIso(), photos: [], findings: [] };
  for (const p of r.photos) if (!rec.photos.some(x => x.id === p.id)) rec.photos.push({ id: p.id, caption: p.caption || '' });
  for (const f of r.findings) if (!rec.findings.some(x => x.id === f.id)) rec.findings.push(clone(f));
  rec.frozenAt = rec.frozenAt || nowIso();
  r.fieldRecord = rec;
}

async function moveNext() {
  const r = S.report, ph = r.phase;
  const to = PHASES[PHASES.indexOf(ph) + 1];
  const missing = [];
  if (ph === 'pre') { if (!r.header.title) missing.push('Report title'); if (!r.header.inspector) missing.push('Inspector'); }
  if (ph === 'field' && !r.header.inspectionDate) missing.push('Date of inspection');
  if (missing.length) return alertBox('Missing information', 'Fill in: ' + missing.join(', '));
  let text = `Move ${r.reportId} to ${PHASE_LABEL[to]}?`;
  if (ph === 'pre') text += ' From then on the field work is done on the tablet or here on the PC.';
  if (ph === 'field') text += ` The field captions and findings will be kept as a record.${r.photos.length ? '' : ' Warning: there are no photos.'}`;
  if (ph === 'field' && office()) text += ' If the field work was done on the tablet, make sure its latest package was uploaded first.';
  if (!await confirmBox('Move to next phase', text, `Move to ${PHASE_LABEL[to]}`)) return;
  await askUser();
  if (ph === 'field') freezeFieldRecord();
  r.phaseHistory.push({ to, at: nowIso(), by: user(), reason: '' });
  r.phase = to; S.dirty = true;
  await save();
}

async function moveBack() {
  const r = S.report; const to = PHASES[PHASES.indexOf(r.phase) - 1];
  const res = await modal({ title: `Return to ${PHASE_LABEL[to]}`, html: `<div class="field"><label class="f">Reason (required, kept in the report history)</label><textarea name="reason" rows="3"></textarea></div>`,
    buttons: [{ label: 'Cancel', value: 'no' }, { label: `Return to ${PHASE_LABEL[to]}`, value: 'yes', primary: true }] });
  if (res.button !== 'yes') return;
  if (!res.values.reason) return alertBox('Reason required', 'Write why the report goes back.');
  await askUser();
  r.phaseHistory.push({ to, at: nowIso(), by: user(), reason: res.values.reason });
  r.phase = to; S.dirty = true;
  await save();
}

async function issueReport() {
  if (!(S.report.conclusion || '').trim()) return alertBox('Conclusion missing', 'Write the conclusion before issuing.');
  const folder = S.mode === 'folder';
  if (!await confirmBox('Issue report', `Issue ${S.report.reportId}? The ${folder ? 'Word file goes' : 'Word and PDF files go'} to 02 - Issued and the report becomes read only.`, 'Issue')) return;
  if (S.dirty) await save();
  toast(folder ? 'Issuing, building the Word file...' : 'Issuing, Word is creating the PDF...', 6000);
  const res = await api('POST', '/api/issue', { file: S.file, baseRevision: S.baseRevision, by: await askUser() });
  await dropDraft(); S.dirty = false;
  if (folder) {
    // the browser cannot drive Word, so the PDF is the one manual step left
    await modal({ title: 'Report issued', html: `<p>${esc(res.docx)}</p>
      <p>Saved in <b>02 - Issued</b>. Last step, the PDF: open that folder in File Explorer, open the Word file,
      then File &gt; Save As &gt; PDF in the same folder. Then sign the PDF.</p>` });
    return goHome();
  }
  const pdfName = res.pdf.split(/[\\/]/).pop(), docName = res.docx.split(/[\\/]/).pop();
  const r = await modal({ title: 'Report issued', html: `<p>${esc(docName)}<br>${esc(pdfName)}</p><p class="hint">Saved in 02 - Issued. Sign the PDF.</p>`,
    buttons: [{ label: 'Open Word', value: 'docx' }, { label: 'Open PDF', value: 'pdf', primary: true }, { label: 'Close', value: 'close' }] });
  if (r.button === 'pdf') await api('POST', '/api/open', { name: pdfName });
  if (r.button === 'docx') await api('POST', '/api/open', { name: docName });
  S.dirty = false; await goHome();
}

app.addEventListener('input', (e) => {
  const el = e.target; const path = el.dataset.path;
  if (!path || !S.report) return;
  let v = el.value;
  if (el.dataset.num) v = v.trim() === '' ? '' : (isNaN(Number(v)) ? v : Number(v));
  setPath(S.report, path, v); markDirty();
});

const ACTIONS = {
  async 'set-user'() { await askUser(true); },
  async refresh() { await loadList(); render(); },
  async home() { await goHome(); },
  async open(el) { await openServerReport(el.dataset.file, false); },
  async 'open-issued'(el) { await openServerReport(el.dataset.file, true); },
  async 'open-doc'(el) {
    if (S.mode === 'folder') await openIssuedDoc(el.dataset.name);
    else await api('POST', '/api/open', { name: el.dataset.name });
  },
  async 'connect-folder'() {
    let handle;
    try { handle = await window.showDirectoryPicker({ id: 'fieldReports', mode: 'readwrite' }); } catch (e) { if (e.name === 'AbortError') return; throw e; }
    await connectFolder(handle);
  },
  async 'reconnect-folder'() { await connectFolder(S.savedFolder); },
  async 'disconnect-folder'() {
    if (!await confirmBox('Disconnect folder', 'Stop working in the reports folder on this PC? You can connect it again at any time.', 'Disconnect')) return;
    await setSetting('folder', null); ROOT = null; S.savedFolder = null; S.mode = 'file'; S.models = []; await goHome();
  },
  async new() {
    const r = await modal({ title: 'New report', html: `
      <div class="field"><label class="f">Report title *</label><input type="text" name="title" placeholder="e.g. Bolt Torque Verification Inspection Report"></div>
      <div class="field"><label class="f">Subject (short, for the page header)</label><input type="text" name="subject" placeholder="e.g. Compressor Room Access Landing"></div>
      <div class="field"><label class="f">WBS</label><input type="text" name="wbs" placeholder="e.g. 211"></div>
      <div class="field"><label class="f">Inspector *</label><input type="text" name="inspector" value="${esc(user())}"></div>
      <p class="hint">The report number is assigned automatically.</p>`,
      buttons: [{ label: 'Cancel', value: 'no' }, { label: 'Create', value: 'yes', primary: true }] });
    if (r.button !== 'yes') return;
    if (!r.values.title || !r.values.inspector) return alertBox('Missing information', 'Title and Inspector are required.');
    const res = await api('POST', '/api/new', { header: r.values, by: await askUser() });
    toast(`${res.report.reportId} created`);
    await openServerReport(res.file, false);
  },
  async 'open-zip'() {
    const [f] = await pickFiles({ accept: '.zip,application/zip,.txt,text/plain' }); // .zip.txt: sent, not yet tidied by the office
    if (f) { await openZipFile(f); await confirmUser(); }
  },
  async resume(el) { const d = await getDraft(el.dataset.key); if (d) { resumeDraft(d); await confirmUser(); } },
  async discard(el) {
    if (!await confirmBox('Discard', 'Discard the work kept on this device for this report? Anything not uploaded is lost.', 'Discard')) return;
    await dropDraft(el.dataset.key); await goHome();
  },
  async save() { await save(); },
  async draft() {
    if (S.dirty && ownsPhase(S.report.phase)) await save();
    toast('Opening the draft in Word...', 4000);
    await api('POST', '/api/draft', { file: S.file });
  },
  async 'word-draft'() { await wordDraft(); },
  async next() { await moveNext(); },
  async back() { await moveBack(); },
  async issue() { await issueReport(); },

  async 'toggle-model'(el) {
    const r = S.report, id = el.dataset.id, m = S.models.find(x => x.id === id);
    if (el.checked) {
      r.models.push(id);
      for (const p of m.parameters) if (!r.parameters.some(x => x.label === p.label)) r.parameters.push({ label: p.label, value: '', phase: p.phase, model: id });
      r.results.push({ modelId: id, title: m.results.title, totalRow: !!m.results.totalRow, columns: clone(m.results.columns), rows: [] });
    } else {
      const block = r.results.find(b => b.modelId === id);
      const hasData = (block && block.rows.length) || r.parameters.some(p => p.model === id && p.value);
      if (hasData && !await confirmBox('Remove model', `Remove "${m.name}"? Its parameters and results rows will be deleted.`, 'Remove')) { el.checked = true; return; }
      r.models = r.models.filter(x => x !== id);
      r.parameters = r.parameters.filter(p => p.model !== id);
      r.results = r.results.filter(b => b.modelId !== id);
    }
    markDirty(); render();
  },
  'param-add'() { S.report.parameters.push({ label: '', value: '', phase: 'pre' }); markDirty(); render(); },
  'row-add'(el) {
    const arr = getPath(S.report, el.dataset.path); const row = {};
    el.dataset.keys.split(',').forEach(k => { row[k] = ''; });
    if (el.dataset.path === 'findings') row.id = arr.reduce((m, f) => Math.max(m, f.id || 0), 0) + 1;
    arr.push(row); markDirty(); render();
  },
  'row-del'(el) { getPath(S.report, el.dataset.path).splice(+el.dataset.i, 1); markDirty(); render(); },
  move(el) {
    const arr = getPath(S.report, el.dataset.path), i = +el.dataset.i, j = i + (+el.dataset.d);
    if (j < 0 || j >= arr.length) return; [arr[i], arr[j]] = [arr[j], arr[i]]; markDirty(); render();
  },
  async 'img-add'(el) {
    const files = await pickFiles({ accept: 'image/*', multiple: true });
    for (const p of await addImages(files, 'drawings')) getPath(S.report, el.dataset.path).push({ file: p, caption: '' });
    markDirty(); render();
  },
  async 'img-del'(el) {
    if (!await confirmBox('Remove image', 'Remove this image from the report?', 'Remove')) return;
    const arr = getPath(S.report, el.dataset.path); const [item] = arr.splice(+el.dataset.i, 1);
    dropAsset(item.file); markDirty(); render();
  },
  async 'photo-take'() { await addPhotos(await pickFiles({ accept: 'image/*', capture: true })); },
  async 'photo-add'() { await addPhotos(await pickFiles({ accept: 'image/*', multiple: true })); },
  async 'photo-replace'(el) {
    const files = await pickFiles({ accept: 'image/*' }); if (!files.length) return;
    const [p] = await addImages(files, 'photos'); if (!p) return;
    const ph = S.report.photos[+el.dataset.i]; dropAsset(ph.file); ph.file = p; markDirty(); render();
  },
  'annex-add'() { S.report.annexes.push({ title: '', blocks: [] }); markDirty(); render(); },
  async 'annex-del'(el) {
    if (!await confirmBox('Remove annex', 'Remove this annex and everything in it?', 'Remove')) return;
    const [a] = S.report.annexes.splice(+el.dataset.i, 1);
    a.blocks.forEach(b => { if (b.kind === 'image') dropAsset(b.file); }); markDirty(); render();
  },
  async 'block-add'(el) {
    const blocks = S.report.annexes[+el.dataset.ai].blocks, kind = el.dataset.kind;
    if (kind === 'image') {
      for (const p of await addImages(await pickFiles({ accept: 'image/*', multiple: true }), 'annex')) blocks.push({ kind: 'image', file: p, caption: '' });
    } else if (kind === 'table') blocks.push({ kind: 'table', heading: '', columns: ['Column 1', 'Column 2'], rows: [['', '']], highlightRows: [] });
    else blocks.push({ kind: 'text', text: '' });
    markDirty(); render();
  },
  async 'block-del'(el) {
    if (!await confirmBox('Remove', 'Remove this part of the annex?', 'Remove')) return;
    const [b] = getPath(S.report, el.dataset.path).splice(+el.dataset.i, 1);
    if (b.kind === 'image') dropAsset(b.file); markDirty(); render();
  },
  'annex-row-add'(el) { const b = getPath(S.report, el.dataset.path); b.rows.push(b.columns.map(() => '')); markDirty(); render(); },
  'annex-row-del'(el) {
    const b = getPath(S.report, el.dataset.path), i = +el.dataset.i; b.rows.splice(i, 1);
    b.highlightRows = (b.highlightRows || []).filter(x => x !== i).map(x => (x > i ? x - 1 : x)); markDirty(); render();
  },
  'annex-col-add'(el) { const b = getPath(S.report, el.dataset.path); b.columns.push(`Column ${b.columns.length + 1}`); b.rows.forEach(r => r.push('')); markDirty(); render(); },
  'annex-col-del'(el) { const b = getPath(S.report, el.dataset.path); if (b.columns.length < 2) return; b.columns.pop(); b.rows.forEach(r => r.pop()); markDirty(); render(); },
  'annex-hl'(el) {
    const b = getPath(S.report, el.dataset.path), i = +el.dataset.i; const s = new Set(b.highlightRows || []);
    if (el.checked) s.add(i); else s.delete(i); b.highlightRows = [...s].sort((x, y) => x - y); markDirty();
  }
};

// ---------------------------------------------------------------------------
//  Word report in the browser (field_report.js + the "docx" library)

let docxLibPromise = null;

function loadDocxLib() {
  if (window.docx) return Promise.resolve(window.docx);
  if (!docxLibPromise) docxLibPromise = new Promise((resolve, reject) => {
    const s = document.createElement('script'); s.src = DOCX_LIB_URL; s.async = true;
    s.onload = () => window.docx ? resolve(window.docx) : reject(new Error('Word library did not start.'));
    s.onerror = () => { docxLibPromise = null; reject(new Error('Could not download the Word library. It needs internet the first time in each session.')); };
    document.head.appendChild(s);
  });
  return docxLibPromise;
}

function b64ToBytes(b64) { const s = atob(b64); const u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u; }

async function assetBlob(path) {
  const a = S.assets[path]; if (!a) throw new Error(`Image missing from the report: ${path}`);
  if (a.blob || a.src) return a.blob || a.src;
  const r = await fetch(a.url); if (!r.ok) throw new Error(`Could not read image ${path}`);
  return r.blob();
}

// probe (no size): dimensions only; with a size: JPEG at that size (never upscaled)
async function reportImage(blob, wpx, hpx) {
  const bmp = await createImageBitmap(blob);
  const width = bmp.width, height = bmp.height;
  if (!wpx) { if (bmp.close) bmp.close(); return { width, height }; }
  let out = blob;
  if (width > wpx || height > hpx || blob.type !== 'image/jpeg') {
    const c = document.createElement('canvas'); c.width = Math.min(width, wpx); c.height = Math.min(height, hpx);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    out = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.85));
  }
  if (bmp.close) bmp.close();
  return { data: new Uint8Array(await out.arrayBuffer()), width, height, type: 'jpg' };
}

// getBlob(path) gives each image of the report
async function buildDocx(report, getBlob, draft) {
  const D = await loadDocxLib();
  const logoBytes = b64ToBytes(GMIN_LOGO_B64);
  const dv = new DataView(logoBytes.buffer);
  const logo = { data: logoBytes, width: dv.getUint32(16), height: dv.getUint32(20) };
  const getImage = async (path, wpx, hpx) => reportImage(await getBlob(path), wpx, hpx);
  const doc = await window.FieldReportDocx.build(report, { docx: D, getImage, logo, draft });
  return D.Packer.toBlob(doc);
}

async function wordDraft() {
  toast('Building the Word file...', 4000);
  const draft = S.report.phase !== 'issued';
  download(await buildDocx(S.report, assetBlob, draft), window.FieldReportDocx.outputName(S.report, draft));
  toast('Word file saved to Downloads.');
}

// ---------------------------------------------------------------------------
//  Office in the browser: the app works directly in "006 - Field Reports"
//  (File System Access, Edge or Chrome on the PC). Same rules as server.py.
// ---------------------------------------------------------------------------
const IN_PROGRESS = '01 - In Progress', ISSUED = '02 - Issued', SUPERSEDED = '_superseded';
const ID_RE = /^Field_Report_(\d{4})_(\d{2})_(\d{4})/;
const UPLOAD_SUFFIX_RE = /( \(\d+\)| - rev\d+)+(?=\.zip$)/i;
const ASSET_RE = /^(photos|drawings|annex)\/[A-Za-z0-9_-]{1,64}\.(jpg|jpeg|png)$/;
const DEFAULT_PROJECT = 'Oko Gold Mines';
const SHARE_SUFFIX = '.txt'; // see sharePackage()
const canPickFolder = typeof window.showDirectoryPicker === 'function';
let ROOT = null;

function apiError(message, status) { const e = new Error(message); e.status = status || 400; return e; }
const isZip = (name) => /\.zip$/i.test(name);
const localDate = () => new Date().toLocaleDateString('en-CA'); // YYYY-MM-DD
const stamp = () => { const d = new Date(), p = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`; };

async function subdir(name, create = true) {
  let d = ROOT;
  for (const part of name.split('/')) d = await d.getDirectoryHandle(part, { create });
  return d;
}
async function fileNames(name) {
  let d; try { d = await subdir(name, false); } catch (e) { return []; }
  const out = []; for await (const h of d.values()) if (h.kind === 'file') out.push(h.name);
  return out;
}
async function fileIn(dir, name) { try { return await dir.getFileHandle(name); } catch (e) { return null; } }
async function packageFile(sub, name) {
  if (!name || /[\\/]/.test(name) || !isZip(name)) throw apiError(`Invalid package name: ${name}`);
  const fh = await fileIn(await subdir(sub), name);
  if (!fh) throw apiError(`Package not found: ${name}`, 404);
  return fh.getFile();
}
async function reportOf(file) {
  const z = await readZip(file, (n) => n === 'report.json');
  if (!z['report.json']) throw new Error('report.json is missing');
  return JSON.parse(new TextDecoder().decode(z['report.json']).replace(/^﻿/, ''));
}
async function assetsOf(file) {
  const z = await readZip(file, (n) => ASSET_RE.test(n)); const out = {};
  for (const [n, data] of Object.entries(z)) out[n] = new Blob([data], { type: 'image/jpeg' });
  return out;
}
async function writeFile(dir, name, blob) {
  // the browser writes to a side file and swaps it in on close, so OneDrive
  // never uploads a half-written package
  const w = await (await dir.getFileHandle(name, { create: true })).createWritable();
  await w.write(blob); await w.close();
}
async function writePackage(dir, name, report, assets) {
  const entries = [{ name: 'report.json', data: new TextEncoder().encode(JSON.stringify(report, null, 2)) }];
  for (const n of Object.keys(assets).sort()) entries.push({ name: n, data: new Uint8Array(await assets[n].arrayBuffer()) });
  await writeFile(dir, name, makeZip(entries));
}
async function moveFile(fromDir, name, toDir, newName) {
  const fh = await fromDir.getFileHandle(name);
  try { if (fh.move) { await fh.move(toDir, newName); return; } } catch (e) { /* not supported here: copy below */ }
  await writeFile(toDir, newName, await fh.getFile());
  await fromDir.removeEntry(name);
}

function shortName(text, limit) {
  const s = window.FieldReportDocx.clean(text || '').replace(/[\\/:*?"<>|]+/g, '-').replace(/\s+/g, ' ').trim().slice(0, 120);
  return window.FieldReportDocx.shortText(s, limit);
}
function canonicalName(report) {
  const short = shortName(report.header && report.header.title, 40);
  return short ? `${report.reportId} - ${short}.zip` : `${report.reportId}.zip`;
}

// The tablet saves by download + upload, each save as "name - revN.zip"
// (a phone may give "name (1).zip"). Keep the highest revision of each report
// under its original name, move the others to _superseded (never deleted).
async function consolidate(inDir) {
  // packages sent from the tablet share menu arrive as ".zip.txt"
  const shared = [];
  for await (const h of inDir.values()) if (h.kind === 'file' && /\.zip\.txt$/i.test(h.name)) shared.push(h.name);
  for (const n of shared) {
    let target = n.replace(/\.txt$/i, '');
    for (let k = 2; await fileIn(inDir, target); k++) target = n.replace(/\.zip\.txt$/i, ` (${k}).zip`);
    await moveFile(inDir, n, inDir, target);
  }
  const byId = {};
  for await (const h of inDir.values()) {
    if (h.kind !== 'file' || !isZip(h.name)) continue;
    try {
      const f = await h.getFile(), rep = await reportOf(f);
      (byId[rep.reportId] = byId[rep.reportId] || []).push({ rev: rep.revision || 0, mtime: f.lastModified, name: h.name });
    } catch (e) { continue; } // unreadable or still uploading: leave it alone
  }
  for (const items of Object.values(byId)) {
    items.sort((a, b) => b.rev - a.rev || b.mtime - a.mtime || (a.name < b.name ? 1 : -1));
    const keep = items[0];
    if (items.length > 1) {
      const sup = await subdir(`${IN_PROGRESS}/${SUPERSEDED}`), st = stamp();
      for (const it of items.slice(1)) await moveFile(inDir, it.name, sup, `${it.name.replace(/\.zip$/i, '')}_${st}.zip`);
    }
    const target = keep.name.replace(UPLOAD_SUFFIX_RE, '');
    if (target !== keep.name && !await fileIn(inDir, target)) await moveFile(inDir, keep.name, inDir, target);
  }
}

async function listInProgress() {
  const inDir = await subdir(IN_PROGRESS);
  await consolidate(inDir);
  const out = [];
  for await (const h of inDir.values()) {
    if (h.kind !== 'file' || !isZip(h.name)) continue;
    let rep;
    try { rep = await reportOf(await h.getFile()); } catch (e) {
      out.push({ file: h.name, error: 'Unreadable package. Still uploading?' }); continue;
    }
    const hd = rep.header || {};
    out.push({ file: h.name, reportId: rep.reportId, seq: rep.seq, title: hd.title, subject: hd.subject, wbs: hd.wbs,
      inspector: hd.inspector, inspectionDate: hd.inspectionDate, phase: rep.phase, revision: rep.revision, lastSaved: rep.lastSaved });
  }
  return out.sort((a, b) => (b.seq || 0) - (a.seq || 0));
}

// from file names only: opening every issued package would make OneDrive download all of them
async function listIssued() {
  const names = await fileNames(ISSUED);
  return names.filter(isZip).sort().reverse().map((fname) => {
    const base = fname.replace(/\.zip$/i, ''), rid = base.split(' - ')[0];
    return { file: fname, reportId: rid, title: base.includes(' - ') ? base.slice(rid.length + 3) : '',
      documents: names.filter(n => n.startsWith(rid) && /\.(pdf|docx)$/i.test(n)).sort() };
  });
}

async function nextSeq() {
  let max = 0;
  for (const sub of [IN_PROGRESS, `${IN_PROGRESS}/${SUPERSEDED}`, ISSUED]) {
    for (const n of await fileNames(sub)) { const m = ID_RE.exec(n); if (m) max = Math.max(max, +m[1]); }
  }
  if (max + 1 > 9999) throw apiError('Report numbering reached 9999.');
  return max + 1;
}

async function createReport(body) {
  const h = body.header || {}, by = (body.by || '').trim();
  if (!(h.title || '').trim()) throw apiError('Title is required.');
  const inDir = await subdir(IN_PROGRESS), today = new Date();
  for (let i = 0; i < 20; i++) {
    const seq = await nextSeq();
    const rid = `Field_Report_${String(seq).padStart(4, '0')}_${String(today.getMonth() + 1).padStart(2, '0')}_${today.getFullYear()}`;
    const report = {
      schemaVersion: 2, reportId: rid, seq, revision: 1, phase: 'pre',
      phaseHistory: [{ to: 'pre', at: nowIso(), by, reason: '' }],
      lastSaved: { at: nowIso(), by, device: 'pc' },
      header: { title: (h.title || '').trim(), subject: (h.subject || '').trim(), wbs: (h.wbs || '').trim(),
        location: '', inspectionDate: '', inspector: (h.inspector || '').trim() },
      general: { project: DEFAULT_PROJECT, wbsArea: '', system: '', description: '', contractor: '', drawings: '' },
      models: [], parameters: [], scope: [], results: [], findings: [], drawings: [], photos: [],
      fieldRecord: null, conclusion: '', annexes: [], issued: null
    };
    const name = canonicalName(report);
    if (await fileIn(inDir, name)) continue; // another PC just took this number
    await writePackage(inDir, name, report, {});
    return { file: name, report };
  }
  throw apiError('Could not reserve a report number, try again.');
}

async function loadPackage(name, issued) {
  const file = await packageFile(issued ? ISSUED : IN_PROGRESS, name);
  const report = await reportOf(file), blobs = await assetsOf(file);
  return { file: name, report, assets: Object.keys(blobs), blobs, readOnly: !!issued };
}

async function savePackage(body) {
  const inDir = await subdir(IN_PROGRESS);
  const file = await packageFile(IN_PROGRESS, body.file);
  const report = clone(body.report || {});
  const current = await reportOf(file);
  if (current.reportId !== report.reportId) throw apiError('This package belongs to another report.');
  if (current.revision !== body.baseRevision) {
    throw apiError(`This report was saved somewhere else in the meantime (revision ${current.revision}, you opened revision ${body.baseRevision}). Reload it before saving, your changes are kept in this browser.`, 409);
  }
  if (current.phase === 'issued') throw apiError('This report is already issued.');
  if (!['pre', 'field', 'closeout'].includes(report.phase)) throw apiError('A report is only issued with the Issue button.');
  const assets = await assetsOf(file);
  for (const n of body.removedAssets || []) delete assets[n];
  for (const [n, blob] of Object.entries(body.newAssets || {})) {
    if (!ASSET_RE.test(n)) throw apiError(`Invalid image name: ${n}`);
    assets[n] = blob; // already upright JPEG, max 2000 px (processImage)
  }
  const referenced = collectRefs(report), kept = {};
  for (const n of referenced) if (assets[n]) kept[n] = assets[n];
  const missing = referenced.filter(n => !kept[n]);
  if (missing.length) throw apiError('Images missing from the save: ' + missing.sort().join(', '));
  report.revision = (current.revision || 0) + 1;
  report.lastSaved = { at: nowIso(), by: body.by || '', device: 'pc' };
  await writePackage(inDir, body.file, report, kept);
  return { file: body.file, report, blobs: kept };
}

async function issuePackage(body) {
  const inDir = await subdir(IN_PROGRESS), iss = await subdir(ISSUED), by = body.by || '';
  const file = await packageFile(IN_PROGRESS, body.file);
  const report = await reportOf(file);
  if (report.revision !== body.baseRevision) throw apiError('Save the report (or reload it) before issuing.', 409);
  if (report.phase !== 'closeout') throw apiError('Only a report in Close-out can be issued.');
  if (!(report.conclusion || '').trim()) throw apiError('Write the conclusion before issuing.');
  report.phase = 'issued';
  report.phaseHistory.push({ to: 'issued', at: nowIso(), by, reason: '' });
  report.issued = { date: localDate(), by };
  report.revision = (report.revision || 0) + 1;
  report.lastSaved = { at: nowIso(), by, device: 'pc' };
  if (await fileIn(iss, body.file)) throw apiError(`An issued package with this name already exists: ${body.file}`);
  const assets = await assetsOf(file);
  // all or nothing: on any failure the report stays in Close-out, nothing left in Issued
  let docName = null;
  try {
    await writePackage(iss, body.file, report, assets);
    const docx = await buildDocx(report, async (p) => { if (!assets[p]) throw new Error(`Image missing from the report: ${p}`); return assets[p]; }, false);
    const base = window.FieldReportDocx.outputName(report, false).replace(/\.docx$/, '');
    docName = `${base}.docx`;
    for (let n = 2; await fileIn(iss, docName); n++) docName = `${base} (${n}).docx`;
    await writeFile(iss, docName, docx);
  } catch (e) {
    for (const n of [body.file, docName]) if (n && await fileIn(iss, n)) { try { await iss.removeEntry(n); } catch (x) { /* best effort */ } }
    throw e;
  }
  await inDir.removeEntry(body.file);
  return { docx: docName, report };
}

// a single page, but a double click must not run two writes at once
let busy = Promise.resolve();
function locked(fn) { const run = busy.then(fn); busy = run.catch(() => {}); return run; }

async function localApi(method, path, body) {
  const url = new URL(path, 'http://x'), q = Object.fromEntries(url.searchParams);
  if (!ROOT) throw apiError('The reports folder is not connected.');
  switch (`${method} ${url.pathname}`) {
    case 'GET /api/reports': return locked(async () => ({ inProgress: await listInProgress(), issued: await listIssued() }));
    case 'GET /api/report': return loadPackage(q.file, q.issued === '1');
    case 'POST /api/new': return locked(() => createReport(body));
    case 'POST /api/save': return locked(() => savePackage(body));
    case 'POST /api/issue': return locked(() => issuePackage(body));
    default: throw apiError(`Not available in this mode: ${path}`, 404);
  }
}

async function connectFolder(handle) {
  const opts = { mode: 'readwrite' };
  if (await handle.queryPermission(opts) !== 'granted' && await handle.requestPermission(opts) !== 'granted') {
    throw apiError('The browser was not allowed to edit files in that folder.');
  }
  // only the folder that holds "01 - In Progress": picking a folder one level
  // too deep (or too high) must not create a second set of report folders
  if (!await hasDir(handle, IN_PROGRESS)) {
    const inside = [IN_PROGRESS, ISSUED, SUPERSEDED].includes(handle.name);
    return alertBox('Wrong folder', inside
      ? `"${handle.name}" is a folder inside the reports folder. Choose the folder above it, "006 - Field Reports".`
      : `"${handle.name}" is not the reports folder (it has no "${IN_PROGRESS}" folder). Choose "006 - Field Reports".`);
  }
  ROOT = handle; S.mode = 'folder'; S.root = handle.name; S.models = BUILT_IN_MODELS; S.savedFolder = handle;
  await setSetting('folder', handle);
  await goHome();
}
async function hasDir(dir, name) { try { await dir.getDirectoryHandle(name); return true; } catch (e) { return false; } }

async function openIssuedDoc(name) {
  if (!name || /[\\/]/.test(name) || !/\.(pdf|docx)$/i.test(name)) throw apiError('Invalid document name.');
  const fh = await fileIn(await subdir(ISSUED), name);
  if (!fh) throw apiError('Document not found.', 404);
  const file = await fh.getFile();
  if (/\.pdf$/i.test(name)) {
    const w = window.open(URL.createObjectURL(new Blob([file], { type: 'application/pdf' })), '_blank');
    if (w) return;
  }
  download(file, name); // Word copy (or PDF when the browser blocks the new tab)
  toast('A copy was saved to Downloads.');
}

async function addPhotos(files) {
  for (const p of await addImages(files, 'photos')) S.report.photos.push({ id: uid('p'), file: p, caption: '' });
  markDirty(); render();
}

async function onAct(e) {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = ACTIONS[el.dataset.act]; if (!fn) return;
  if (el.tagName !== 'INPUT') e.preventDefault();
  try { await fn(el); } catch (err) {
    console.error(err);
    await alertBox(err.status === 409 ? 'Saved somewhere else' : 'Something went wrong', err.message || String(err));
  }
}
document.addEventListener('click', (e) => { if (!e.target.closest('[data-act]') || e.target.closest('[data-act]').type === 'checkbox') return; onAct(e); });
document.addEventListener('change', (e) => { const el = e.target.closest('[data-act]'); if (el && el.type === 'checkbox') onAct(e); });

window.addEventListener('beforeunload', (e) => { if (S.dirty) { saveDraft(); e.preventDefault(); e.returnValue = ''; } });

// ---------------------------------------------------------------------------
//  Start
// ---------------------------------------------------------------------------
(async function start() {
  render();
  // ask the browser not to clear the field work when the device runs low on space
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { /* not supported */ }
  try {
    if (S.mode === 'server') {
      const cfg = await api('GET', '/api/config');
      S.models = cfg.models; S.root = cfg.root;
      await loadList();
    } else {
      S.fileDrafts = (await allDrafts() || []).filter(d => d.mode === 'file');
      if (canPickFolder) {
        // PC browser: back into the reports folder when the browser still allows it
        S.savedFolder = await getSetting('folder');
        if (S.savedFolder && await S.savedFolder.queryPermission({ mode: 'readwrite' }) === 'granted') await connectFolder(S.savedFolder);
      }
    }
    render();
    if (!user()) await askUser();
  } catch (err) {
    app.innerHTML = `<div class="banner warn">${esc(err.message)}</div>`;
  }
})();
})();
</script>
